[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gx-engine-flash"
version = "2.0.0"
description = "GX-Engine Flash - high-performance in-memory graph engine powered by igraph (C core), with graph storage, search, partitioning and semantic retrieval (GraphRAG)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "GX Contributors" }]
keywords = [
    "graph", "graph-engine", "igraph", "high-performance",
    "graph-search", "graph-partition", "community-detection", "graphrag",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
requires-python = ">=3.9"
dependencies = [
    "igraph>=0.11",
    "leidenalg>=0.10",
    "numpy",
    "scipy>=1.10",
    "scikit-learn",
]

[project.optional-dependencies]
# NetworkX is NO LONGER required. It is only used as a last-resort fallback
# backend (and by the optional matplotlib/pyvis visualization helpers).
compat = ["networkx>=2.6"]
viz = ["pyvis", "matplotlib"]
embed = ["openai", "torch", "transformers"]

[tool.setuptools]
py-modules = ["graph_backends", "graph_engine", "graph_rag"]
